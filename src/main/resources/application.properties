spring.application.name=taller-spring-security

# H2 (in-memory database, recreated on every start)
spring.datasource.url=jdbc:h2:mem:taller;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Run data.sql after Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:taller)
spring.h2.console.enabled=true

